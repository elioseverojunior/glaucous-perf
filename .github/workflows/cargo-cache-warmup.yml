name: Cargo Cache Warmup

# Pre-pays the download half of performance.yml's `benchmark` preflight. It
# DOWNLOADS; it does not compile, and it never runs a benchmark.
#
# setup-rust-env layers its cache, and the layers are warmed independently:
#
#   registry  ~/.cargo/registry, keyed `registry-<os>-<arch>-<suffix>-<lockHash>`.
#             No toolchain and no build-env digest -- crate sources are just
#             archives -- so `cargo fetch` alone warms it completely. 157-167 MB
#             per architecture, and the single biggest item this buys.
#   bin       cargo tools, keyed `bin-<os>-<arch>-<toolSetHash>`. Warmed by
#             setup-rust-env running at all; no cargo command required.
#   mise      keyed on runner.os/runner.arch + mise.lock, warmed the same way.
#             159 MB, and the reason a cold ARM64 leg used to burn ~8 minutes
#             in `mise install` before it measured anything.
#   build     target/, keyed with the spec and build-env digests. Warming it
#             would mean compiling the bench crate, which is deliberately NOT
#             done here -- the bench job still pays that cost itself.
#
# What makes any of it reachable is key parity, and GitHub gives no partial
# credit: one divergent segment is a total miss. The two segments this workflow
# has to get right are the suffix -- `perf-<key>-<toolchain>`, taken from the
# same shared matrix performance.yml uses -- and the runner architecture, so an
# aarch64 leg lands on `...-ARM64-...` rather than `...-X64-...`. See the `env:`
# block below for the third, subtler one.
#
# The matrix is NOT declared here. It comes from shared-matrix.yml, which is
# also what performance.yml consumes -- one definition of the platform table is
# the only way the two stay in lockstep as it changes.

concurrency:
  group: cargo-cache-warmup-${{ github.ref_name }}
  # Never cancel: a run killed mid-save leaves the key unwritten, and the next
  # bench job pays the full cold cost it was meant to avoid.
  cancel-in-progress: false

on:
  schedule:
    # Daily at midnight UTC. `schedule` always runs on the DEFAULT branch, which
    # is what makes the resulting caches readable from every branch -- a cache
    # saved on a topic branch is visible only to that branch and its children.
    - cron: "0 0 * * *"
  workflow_dispatch:

# A warmer reads the repository and writes caches. Nothing else. The cache API
# needs no declared scope, so `contents: read` is the whole requirement, and a
# called reusable workflow can never exceed what is granted here.
permissions:
  contents: read

# NOTHING here may match rust-toolchain's build-env digest, or this workflow
# writes to a key the bench job never reads. That digest hashes every variable
# prefixed CARGO_, CC, CFLAGS, CXX, CMAKE or RUST, minus an exclusion list.
# `CARGO_TERM_COLOR` is excluded (presentation, not output). `RUST_BACKTRACE`
# is NOT -- and setting it is exactly how the previous version of this file
# ended up on `...-95fb48e7-...` while every consumer sat on `...-e3b0c442-...`
# (sha256("") -- no build-affecting environment at all). Verify before adding
# a variable here: `sha256("NAME=value")[:8]` must stay `e3b0c442`.
env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  #  1.  Matrix — the SAME platform table performance.yml benches on
  # ──────────────────────────────────────────────
  matrix:
    name: Matrix
    uses: ./.github/workflows/shared-matrix.yml
    # Deliberately no inputs: the defaults (`all`/`default`/`default`) are what
    # a dispatched perf run uses, and warming any other combination would write
    # keys nothing reads.

  # ──────────────────────────────────────────────
  #  2.  Warmup — one native host per matrix leg
  # ──────────────────────────────────────────────
  warmup-cache:
    name: Warm up Cargo cache (${{ matrix.label }})
    needs: [matrix]
    runs-on: ${{ matrix.runner }}
    # A toolchain install plus a dependency download -- no compilation. Well
    # clear of the observed cost, but bounded so a wedged runner cannot burn
    # the schedule.
    timeout-minutes: 15
    strategy:
      # One dead platform must not stop the other from being warmed; a
      # half-warm cache is strictly better than none.
      fail-fast: false
      matrix:
        # No base keys: `include` alone expands to exactly the legs the shared
        # matrix emitted, one job each.
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Mirrors the bench job: depth 1, no submodules. Nothing that feeds a
          # cache key -- Cargo.lock, mise.lock -- lives in history or a
          # submodule, and cloning either on every leg buys nothing.
          fetch-depth: 1

      # Warms three layers at once: `registry` and `build` under the perf
      # suffix below, plus the suffix-less `bin` (cargo tools) and mise layers
      # keyed only on runner.os/runner.arch -- the ones behind the multi-minute
      # cold `mise install` this workflow exists to remove.
      - name: Setup Environment
        uses: ./.github/actions/setup-rust-env
        with:
          toolchain: ${{ matrix.toolchain }}
          profile: ${{ matrix.profile }}
          # MUST stay identical to performance.yml's `benchmark` job. This one
          # string is what decides whether any of this work is reachable.
          cache-key-suffix: perf-${{ matrix.key }}-${{ matrix.toolchain }}

      # The guard matters MORE here than in the bench job. A mislabelled runner
      # makes a benchmark publish wrong numbers, which is visible; it makes a
      # warmer write x86_64 artifacts under an aarch64 key, which is not -- the
      # bench job then restores a cache it cannot link against and rebuilds from
      # scratch, having paid the download for nothing.
      - name: Assert the host is the architecture it claims to be
        env:
          EXPECTED: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "rustc host triple: ${host}"
          if [ "${host}" != "${EXPECTED}" ]; then
            echo "::error::runner is ${host}, but the matrix entry declares ${EXPECTED}."
            echo "::error::Warming this key would poison it with foreign artifacts."
            exit 1
          fi

      # Fills ~/.cargo/registry, and that is the whole job. The `registry` layer
      # is keyed `registry-<os>-<arch>-<suffix>-<lockHash>` -- no toolchain, no
      # build-env digest, no compiled anything -- because it holds downloaded
      # source archives that any rustc can consume. Fetching is therefore the
      # complete and sufficient way to warm it; nothing is built here.
      #
      # `--locked` so a drifted Cargo.lock fails loudly rather than resolving a
      # different graph and writing the wrong lockHash segment.
      - name: Fetch the dependency graph
        run: cargo fetch --locked

      - name: Summary
        env:
          LABEL: ${{ matrix.label }}
          RUNNER_LABEL: ${{ matrix.runner }}
          TARGET: ${{ matrix.target }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          SUFFIX: perf-${{ matrix.key }}-${{ matrix.toolchain }}
          LEGS: ${{ needs.matrix.outputs.count }}
        run: |
          set -Eeuo pipefail
          {
            echo "### Cache warmed — ${LABEL}"
            echo
            echo "| | |"
            echo "|:--|:--|"
            echo "| Runner | \`${RUNNER_LABEL}\` |"
            echo "| Target | \`${TARGET}\` |"
            echo "| Toolchain | \`${TOOLCHAIN}\` |"
            echo "| Cache suffix | \`${SUFFIX}\` |"
            echo "| Leg | 1 of ${LEGS} |"
            echo
            echo "Warmed: \`registry\` (this suffix), plus \`bin\` and \`mise\` for this architecture."
            echo "NOT warmed: \`build\` -- nothing is compiled here, so the bench job still builds."
            echo
            echo '```'
            du -sh ~/.cargo/registry 2>/dev/null || echo "registry: n/a"
            du -sh ~/.cargo/git 2>/dev/null || echo "git: n/a"
            du -sh target 2>/dev/null || echo "target: n/a"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
