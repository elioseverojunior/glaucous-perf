name: Cargo Cache Warmup

# Pre-pays performance.yml's `benchmark` preflight so a dispatched perf run
# starts measuring instead of compiling.
#
# A cache warmer is only worth anything if the key it WRITES is byte-identical
# to the key the consumer READS -- GitHub treats any divergence as a full miss,
# never a partial restore. That key is built from `runner.os`, `runner.arch`,
# `cache-key-suffix`, the Cargo.lock hash, and a hash of the RESOLVED feature
# set, so this workflow mirrors the bench job on every one of them:
#
#   * runner   -- from the shared matrix, so aarch64 warms on an ARM64 host and
#                 lands under `...-ARM64-...` rather than `...-X64-...`
#   * suffix   -- `perf-<key>-<toolchain>`, character-for-character
#                 performance.yml's own `cache-key-suffix`
#   * features -- the SAME cargo invocation, `cargo bench --locked
#                 -p glaucus-bench --no-run`. Not `--all-features`: that
#                 resolves a different dependency graph, hashes to a different
#                 key, and drags in glaucus-fuzz -> libfuzzer-sys, whose build
#                 script needs a C++ toolchain the ARM64 image does not ship.
#
# The matrix is NOT declared here. It comes from shared-matrix.yml, which is
# also what performance.yml consumes -- one definition of the platform table is
# the only way the two stay in lockstep as it changes.

concurrency:
  group: cargo-cache-warmup-${{ github.ref_name }}
  # Never cancel: a run killed mid-save leaves the key unwritten, and the next
  # bench job pays the full cold cost it was meant to avoid.
  cancel-in-progress: false

on:
  schedule:
    # Daily at midnight UTC. `schedule` always runs on the DEFAULT branch, which
    # is what makes the resulting caches readable from every branch -- a cache
    # saved on a topic branch is visible only to that branch and its children.
    - cron: "0 0 * * *"
  workflow_dispatch:

# A warmer reads the repository and writes caches. Nothing else. The cache API
# needs no declared scope, so `contents: read` is the whole requirement, and a
# called reusable workflow can never exceed what is granted here.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────
  #  1.  Matrix — the SAME platform table performance.yml benches on
  # ──────────────────────────────────────────────
  matrix:
    name: Matrix
    uses: ./.github/workflows/shared-matrix.yml
    # Deliberately no inputs: the defaults (`all`/`default`/`default`) are what
    # a dispatched perf run uses, and warming any other combination would write
    # keys nothing reads.

  # ──────────────────────────────────────────────
  #  2.  Warmup — one native host per matrix leg
  # ──────────────────────────────────────────────
  warmup-cache:
    name: Warm up Cargo cache (${{ matrix.label }})
    needs: [matrix]
    runs-on: ${{ matrix.runner }}
    # A cold release build of the bench crate and its graph. Well clear of the
    # observed cost, but bounded so a wedged runner cannot burn the schedule.
    timeout-minutes: 45
    strategy:
      # One dead platform must not stop the other from being warmed; a
      # half-warm cache is strictly better than none.
      fail-fast: false
      matrix:
        # No base keys: `include` alone expands to exactly the legs the shared
        # matrix emitted, one job each.
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Mirrors the bench job: depth 1, no submodules. Nothing that feeds a
          # cache key -- Cargo.lock, mise.lock -- lives in history or a
          # submodule, and cloning either on every leg buys nothing.
          fetch-depth: 1

      # Warms three layers at once: `registry` and `build` under the perf
      # suffix below, plus the suffix-less `bin` (cargo tools) and mise layers
      # keyed only on runner.os/runner.arch -- the ones behind the multi-minute
      # cold `mise install` this workflow exists to remove.
      - name: Setup Environment
        uses: ./.github/actions/setup-rust-env
        with:
          toolchain: ${{ matrix.toolchain }}
          profile: ${{ matrix.profile }}
          # MUST stay identical to performance.yml's `benchmark` job. This one
          # string is what decides whether any of this work is reachable.
          cache-key-suffix: perf-${{ matrix.key }}-${{ matrix.toolchain }}

      # The guard matters MORE here than in the bench job. A mislabelled runner
      # makes a benchmark publish wrong numbers, which is visible; it makes a
      # warmer write x86_64 artifacts under an aarch64 key, which is not -- the
      # bench job then restores a cache it cannot link against and rebuilds from
      # scratch, having paid the download for nothing.
      - name: Assert the host is the architecture it claims to be
        env:
          EXPECTED: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "rustc host triple: ${host}"
          if [ "${host}" != "${EXPECTED}" ]; then
            echo "::error::runner is ${host}, but the matrix entry declares ${EXPECTED}."
            echo "::error::Warming this key would poison it with foreign artifacts."
            exit 1
          fi

      # .cargo/config.toml pins `linker = "aarch64-linux-gnu-gcc"` for this
      # triple -- written for CROSS-compiling from x86_64, where that name is
      # the cross toolchain. On a native arm64 runner the same triple is the
      # host, and cargo still demands that exact binary name. Debian's multiarch
      # gcc usually provides it; when it does not, the native compiler IS the
      # right one and only the name is missing, so a symlink is the whole fix.
      - name: Provide the linker name .cargo/config.toml expects
        if: matrix.key == 'linux-24.04-aarch64'
        run: |
          set -Eeuo pipefail
          if command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            echo "aarch64-linux-gnu-gcc already on PATH: $(command -v aarch64-linux-gnu-gcc)"
            exit 0
          fi
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v gcc)" "$HOME/.local/bin/aarch64-linux-gnu-gcc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "linked aarch64-linux-gnu-gcc -> $(command -v gcc)"

      # # Character-for-character performance.yml's own "Build benchmarks (warm
      # # cache, fail fast on compile errors)" step. Copying it is the POINT: any
      # # edit here -- a feature flag, a `--target`, another package -- resolves a
      # # different graph, hashes to a different key, and silently detaches this
      # # workflow from the job it serves.
      # #
      # # No `--target`: the matrix guarantees a native host, and passing the
      # # triple would move every artifact into `target/<triple>/release/` where
      # # the bench job's untargeted build never looks.
      # - name: Build benchmarks
      #   run: cargo bench --locked -p glaucus-bench --no-run

      - name: Summary
        env:
          LABEL: ${{ matrix.label }}
          RUNNER_LABEL: ${{ matrix.runner }}
          TARGET: ${{ matrix.target }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          SUFFIX: perf-${{ matrix.key }}-${{ matrix.toolchain }}
          LEGS: ${{ needs.matrix.outputs.count }}
        run: |
          set -Eeuo pipefail
          {
            echo "### Cache warmed — ${LABEL}"
            echo
            echo "| | |"
            echo "|:--|:--|"
            echo "| Runner | \`${RUNNER_LABEL}\` |"
            echo "| Target | \`${TARGET}\` |"
            echo "| Toolchain | \`${TOOLCHAIN}\` |"
            echo "| Cache suffix | \`${SUFFIX}\` |"
            echo "| Leg | 1 of ${LEGS} |"
            echo
            echo "Readable by \`performance.yml\`'s \`benchmark\` job on the same suffix."
            echo
            echo '```'
            du -sh ~/.cargo/registry 2>/dev/null || echo "registry: n/a"
            du -sh ~/.cargo/git 2>/dev/null || echo "git: n/a"
            du -sh target 2>/dev/null || echo "target: n/a"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
