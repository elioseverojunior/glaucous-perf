name: Performance

# Benchmarks one job per NATIVE host; `perf-report` pivots the results.
# Figures from GitHub-hosted runners are marked `degraded`: read ratios down a
# column, never absolute times across them.

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # Dispatch only: benchmark timings on shared runners fail PRs on phantom
  # regressions. Inputs reach a shell through `env:`, never `${{ }}` inline.
  workflow_dispatch:
    inputs:
      platforms:
        description: "Hosts to measure on"
        type: choice
        default: all
        options:
          - all
          - linux
          - linux-24.04-x86_64
          - linux-24.04-aarch64
      channel:
        description: "Rust channel to bench; `default` reads rust-toolchain.toml"
        type: choice
        default: default
        options:
          - default
          - stable
          - nightly
      profile:
        description: "Profile: `default` to setup with rust-toolchain.toml"
        type: choice
        default: default
        options:
          - default
          - minimal
          - complete
      mode:
        description: "`quick` trades Criterion's precision for wall-clock"
        type: choice
        default: full
        options:
          - full
          - quick
      bench:
        description: "One bench target, e.g. `scanner`; empty runs all seven"
        type: string
        default: ""

# Read-only at workflow scope; a job that needs to write declares it itself,
# so a job added later cannot inherit a grant nobody wrote down.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Stops `mise run` installing a task's missing tools mid-job.
  MISE_TASK_RUN_AUTO_INSTALL: false
  # mise.toml exports an EMPTY token when this is unset, which shadows every
  # other credential source and makes API calls unauthenticated.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
  GITVERSION_SPEC: ${{ vars.GITVERSION_SPEC || '6.x' }}
  CRITERION_HOME: ${{ github.workspace }}/target/criterion
  REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

jobs:
  # ──────────────────────────────────────────────
  #  1.  Setup — shared bootstrap for all jobs
  # ──────────────────────────────────────────────
  setup:
    name: Setup
    runs-on: ${{ vars.RUNS_ON_ARM64 || vars.RUNS_ON || 'ubuntu-latest' }}
    outputs:
      cachekey: ${{ steps.setup-rust-env.outputs.cachekey }}
      cachekey-full: ${{ steps.setup-rust-env.outputs.cachekey-full }}
      cache: ${{ steps.setup-rust-env.outputs.cache }}
      cache-hit: ${{ steps.setup-rust-env.outputs.cache-hit }}
      name: ${{ steps.setup-rust-env.outputs.name }}
      toolchain: ${{ steps.setup-rust-env.outputs.toolchain }}
      targets: ${{ steps.setup-rust-env.outputs.targets }}
      target: ${{ steps.setup-rust-env.outputs.target }}
      components: ${{ steps.setup-rust-env.outputs.components }}
      profile: ${{ steps.setup-rust-env.outputs.profile }}
      msrv: ${{ steps.setup-rust-env.outputs.msrv }}
      msrv-effective: ${{ steps.setup-rust-env.outputs.msrv-effective }}
      msrv-source: ${{ steps.setup-rust-env.outputs.msrv-source }}
      set-rustup-toolchain: ${{ steps.setup-rust-env.outputs.set-rustup-toolchain }}
      cargo-tools: ${{ steps.setup-rust-env.outputs.cargo-tools }}
      json: ${{ steps.setup-rust-env.outputs.json }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ env.REF }}

      # Warms the rust AND mise caches for `lint` and `msrv`. The
      # `cargo-binstall failed` lines it emits are a fallback notice, not a
      # failure: those crates publish no prebuilt binary, so mise source-builds
      # them here once per mise.lock change and later jobs restore the cache.
      - name: Setup Environment
        id: setup-rust-env
        uses: ./.github/actions/setup-rust-env

  # ──────────────────────────────────────────────
  #  2.  Version - shared GitVersion SemVer
  # ──────────────────────────────────────────────
  # GitVersion runs HERE and nowhere else in this workflow. It used to be three
  # steps inside `release` -- cache, setup, execute -- which meant the tool was
  # provisioned and the version recomputed inside a job that also tags, pushes
  # and publishes. version.yml owns that now, so there is one definition of what
  # the version is and one place that derives `majorMinor`, which the action
  # itself does not publish.
  #
  # A ROOT job -- no `needs`, no `if:`. It derives the version from tags and
  # commit distance, so it wants the checkout and nothing else; waiting on `build`
  # would serialise it behind the whole test-and-build chain for no reason.
  #
  # The absence of an `if:` is load-bearing, not an oversight. `build` depends on
  # this job and `build` runs on pull requests, and GitHub skips the dependents of
  # a skipped job -- so gating this on `push` to the default branch would skip
  # `build` on every pull request. A job that only `release` consumed could be
  # conditional; one that `build` consumes cannot.
  version:
    name: Version
    permissions:
      contents: read
    uses: ./.github/workflows/version.yml

  # ──────────────────────────────────────────────
  #  3.  Perf matrix — ONE platform table, shared with the cache warmer
  # ──────────────────────────────────────────────
  # The table itself now lives in shared-matrix.yml, which DERIVES it from
  # rust-toolchain.toml instead of hard-coding it. cargo-cache-warmup.yml calls
  # that same workflow, and that shared call IS the cache-reuse mechanism: the
  # benchmark cache key is `perf-<matrix.key>-<matrix.toolchain>` scoped by
  # `<runner.os>-<runner.arch>`, so a warmer and its consumer agree only if both
  # read platform, runner and toolchain from ONE definition. Re-inlining the
  # table here would let the two drift apart in silence -- GitHub treats a
  # divergent key as a total MISS, never a partial restore.
  #
  # `needs: [setup]` is gone with it: the matrix used to borrow that job's
  # resolved toolchain, and shared-matrix.yml reads rust-toolchain.toml itself.
  #
  # `runs-on` remains the ONLY thing that decides which architecture a job
  # measures: crossing `os` with an `arch` dimension puts both halves on the
  # same machine and labels one of them wrong, and cross-compiling cannot rescue
  # it -- a benchmark has to RUN. PERF_RUNNER_* override any label; pointing
  # them at self-hosted metal is how a run stops being `degraded`.
  perf-matrix:
    name: Perf Matrix
    permissions:
      contents: read
    uses: ./.github/workflows/shared-matrix.yml
    with:
      platforms: ${{ inputs.platforms }}
      channel: ${{ inputs.channel }}
      profile: ${{ inputs.profile }}

  # ──────────────────────────────────────────────
  #  4.  Lint — HK project lints
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    # Gating on `version` here stops a version failure surfacing 20 minutes later.
    needs: [setup, version]
    runs-on: ${{ vars.RUNS_ON_ARM64 || vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ env.REF }}

      - name: Setup Environment
        uses: ./.github/actions/setup-rust-env

      - name: Run HK Lints
        run: hk check --all

  # ──────────────────────────────────────────────
  #  5.  MSRV — compile at the DECLARED minimum
  # ──────────────────────────────────────────────
  # The job that keeps `rust-version` honest. Without it an MSRV is a claim, not
  # a constraint: every other job here builds with rust-toolchain.toml's pin, so
  # the declared floor can only ever drift UPWARD, and always silently -- the
  # pinned toolchain never disagrees with it. That is exactly how the workspace
  # came to advertise 1.97 while the code still compiled on 1.88, making every
  # routine toolchain bump an invisible breaking change for consumers (issue #3).
  msrv:
    name: MSRV
    needs: [setup, version]
    runs-on: ${{ vars.RUNS_ON_ARM64 || vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ env.REF }}

      # `msrv-install` puts the floor beside the pinned toolchain without making
      # it active, so comply/ignorefile still build on the pin -- which is what
      # lets this job use the composite at all. The floor is read once, by the
      # action, and published as `msrv`.
      - name: Setup Environment
        id: setup
        uses: ./.github/actions/setup-rust-env
        with:
          msrv-install: "true"
          cache-key-suffix: msrv

      # .clippy.toml declares the floor to clippy, and nothing else compares the
      # two. Left unchecked it keeps linting against a floor the project
      # abandoned; a missing key silently reverts clippy to the pinned toolchain.
      - name: Cross-check .clippy.toml against the declared floor
        env:
          MSRV: ${{ steps.setup.outputs.msrv }}
        run: |
          set -euo pipefail
          if [ -z "${MSRV}" ]; then
            echo "::error file=Cargo.toml::rust-toolchain resolved no rust-version from [workspace.package]"
            exit 1
          fi

          clippy_msrv="$(sed -n 's/^msrv[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' .clippy.toml | head -n1)"
          if [ -z "${clippy_msrv}" ]; then
            echo "::error file=.clippy.toml::no msrv key; it must declare msrv = \"${MSRV}\" to match Cargo.toml"
            exit 1
          fi
          if [ "${clippy_msrv}" != "${MSRV}" ]; then
            echo "::error file=.clippy.toml::msrv \"${clippy_msrv}\" disagrees with Cargo.toml rust-version \"${MSRV}\""
            exit 1
          fi

          echo "Declared MSRV: ${MSRV} (Cargo.toml and .clippy.toml agree)"

      - name: Compile every publishable crate at the MSRV
        env:
          # Reaches the floor the composite installed; `msrv-install` never
          # makes it active, so naming it here is the only way in.
          RUSTUP_TOOLCHAIN: ${{ steps.setup.outputs.msrv }}
          # No RUSTFLAGS override: the composite installs mold, so
          # .cargo/config.toml's per-target flags apply as-is, `-D warnings`
          # included. Warnings stay denied at the floor because `lint` runs on
          # the pin and cannot see a lint that only fires here.
        run: |
          set -euo pipefail
          # NOT `mise run test:all`: it switches to a nightly COVERAGE_TOOLCHAIN,
          # so it would measure coverage on nightly instead of checking anything
          # at the floor. `test:all:msrv` is the task that runs a suite AT the
          # declared floor.
          # Derive the crate list instead of maintaining `--exclude` flags:
          # cargo reports `publish` as [] for `publish = false` and null when
          # publishing is allowed, so this selects exactly what a consumer can
          # install from crates.io -- and a crate added tomorrow is covered the
          # day it lands rather than escaping the gate until someone notices.
          #
          # bench/fuzz/yaml-test-suite are excluded by that rule, which is the
          # point: dev-only crates drag in criterion, tarpaulin and a nightly
          # requirement, and their floors are not part of the promise made to
          # consumers. For the same reason this is `check`, not `test` -- running
          # the suite would let a dev-dependency dictate the published MSRV.
          mapfile -t names < <(
            cargo metadata --format-version 1 --no-deps \
              | jq -r '.packages[] | select(.publish != []) | .name' | sort
          )
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::no publishable crates resolved; refusing to pass vacuously"
            exit 1
          fi
          packages=()
          for name in "${names[@]}"; do packages+=(--package "${name}"); done
          echo "MSRV $(rustc --version)"
          printf 'Checking %s\n' "${names[@]}"
          # `--all-features` because the floor has to hold for every feature a
          # consumer can switch on; a default-only check would let an optional
          # dependency raise the real MSRV without ever failing here.
          cargo check --locked --all-features "${packages[@]}"

  # ──────────────────────────────────────────────
  #  6.  Benchmark — one native run per platform
  # ──────────────────────────────────────────────
  benchmark:
    name: Bench (${{ matrix.label }})
    # NOT `setup`. That job warms the SUFFIX-LESS registry/build layers, and its
    # own comment says so: "for `lint` and `msrv`". This job reads
    # `perf-<key>-<toolchain>` -- a different namespace entirely -- so gating on
    # it only ever bought latency on the critical path. The layers this job DOES
    # share, `bin` and `mise` (keyed on runner.os/runner.arch alone), are warmed
    # for BOTH architectures by cargo-cache-warmup.yml; `setup` runs on X64 and
    # so never warmed the ARM64 leg at all -- which is exactly why that leg used
    # to pay a multi-minute cold `mise install` despite the dependency.
    needs: [version, perf-matrix]
    runs-on: ${{ matrix.runner }}
    # The full suite is ~85 minutes on a healthy host and the slowest platform
    # sets this, not the fastest.
    timeout-minutes: 150
    strategy:
      # A dead runner label or an OOM on one platform must not cancel the three
      # that are measuring fine -- partial results are still results, and
      # `perf-report` renders whatever arrives.
      fail-fast: false
      matrix:
        # No base keys: `include` alone expands to exactly the entries the
        # generator emitted, one job each.
        include: ${{ fromJSON(needs.perf-matrix.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No submodules and no history: nothing the benches read comes from a
          # submodule -- every fixture is generated in code -- and cloning one on
          # four runners buys nothing. bench-to-json.py's `git rev-parse` calls
          # are satisfied by a depth-1 checkout.
          fetch-depth: 1
          ref: ${{ env.REF }}

      - name: Setup Environment
        uses: ./.github/actions/setup-rust-env
        with:
          toolchain: ${{ matrix.toolchain }}
          profile: ${{ matrix.profile }}
          # Namespaced per platform AND per toolchain: these caches key on the
          # dependency set and the toolchain, and four hosts sharing one
          # namespace would otherwise trade artifacts they cannot use.
          cache-key-suffix: perf-${{ matrix.key }}-${{ matrix.toolchain }}

      # The guard that makes the matrix mean what it says. If a runner label
      # ever moves -- GitHub retires an image, someone repoints a PERF_RUNNER_*
      # variable at the wrong metal -- the run would otherwise publish timings
      # from one architecture under another one's name, which is worse than no
      # measurement at all.
      - name: Assert the host is the architecture it claims to be
        env:
          EXPECTED: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "rustc host triple: ${host}"
          if [ "${host}" != "${EXPECTED}" ]; then
            echo "::error::runner is ${host}, but the matrix entry declares ${EXPECTED}."
            echo "::error::Benchmarks must run NATIVELY; a cross-compiled binary cannot execute here."
            exit 1
          fi

      # .cargo/config.toml pins `linker = "aarch64-linux-gnu-gcc"` for this
      # triple -- written for CROSS-compiling from x86_64, where that name is
      # the cross toolchain. On a native arm64 runner the same triple is the
      # host, and cargo still demands that exact binary name. Debian's multiarch
      # gcc usually provides it; when it does not, the native compiler IS the
      # right one and only the name is missing, so a symlink is the whole fix.
      - name: Provide the linker name .cargo/config.toml expects
        if: matrix.key == 'linux-24.04-aarch64'
        run: |
          set -Eeuo pipefail
          if command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            echo "aarch64-linux-gnu-gcc already on PATH: $(command -v aarch64-linux-gnu-gcc)"
            exit 0
          fi
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v gcc)" "$HOME/.local/bin/aarch64-linux-gnu-gcc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "linked aarch64-linux-gnu-gcc -> $(command -v gcc)"

      - name: Print runner profile
        run: |
          set -Eeuo pipefail
          echo "::group::Runner profile"
          uname -a
          rustc --version
          if [ "${RUNNER_OS}" = "Linux" ]; then
            echo "CPUs: $(nproc)"
            free -h | awk '/Mem:/ {print "Mem:  " $2}'
          else
            echo "CPUs: $(sysctl -n hw.ncpu)"
            echo "Mem:  $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GiB"
            sw_vers
          fi
          echo "::endgroup::"

      # Linux-only and best-effort: macOS exposes no equivalent knob, and the
      # governor is not settable on a GitHub-hosted VM at all. It costs seconds
      # and matters on self-hosted metal.
      - name: Reduce CPU frequency variance
        if: runner.os == 'Linux'
        run: |
          sudo cpupower frequency-set --governor performance \
            || echo "cpupower unavailable; continuing with the default governor"

      # Before the run, the only moment the answer means anything. `--report` marks
      # the data rather than failing: on a shared runner a gate would be noise.
      - name: Host preflight
        id: preflight
        run: |
          set -Eeuo pipefail
          python3 scripts/bench-preflight.py --report --snapshot bench-host.json
          quality="$(python3 -c 'import json,pathlib;print(json.loads(pathlib.Path("bench-host.json").read_text())["quality"])')"

          # A GitHub-hosted runner is a shared VM whose wall-clock timings vary
          # by tens of percent between runs. A quiet load average says the
          # measurement was not contaminated by a NEIGHBOURING PROCESS; it says
          # nothing about the hypervisor. Only a host we control can claim `ok`.
          if [ "${RUNNER_ENVIRONMENT}" != "self-hosted" ]; then
            quality="degraded"
            echo "github-hosted runner: forcing quality=degraded"
          fi
          echo "quality=${quality}" >> "$GITHUB_OUTPUT"

      - name: Build benchmarks (warm cache, fail fast on compile errors)
        run: cargo bench --locked -p glaucus-bench --no-run

      - name: Run benchmarks
        env:
          BENCH: ${{ inputs.bench }}
          MODE: ${{ inputs.mode || 'full' }}
        run: |
          set -Eeuo pipefail
          cargo_args=(--locked -p glaucus-bench)
          if [ -n "${BENCH}" ]; then
            cargo_args+=(--bench "${BENCH}")
          fi
          # `--output-format bencher` is what bench-to-json.py and the
          # benchmark-action baseline both parse; `--quick` drops Criterion's
          # sample count for a fast smoke run and is NOT decision-grade.
          criterion_args=(--output-format bencher)
          if [ "${MODE}" = "quick" ]; then
            criterion_args+=(--quick)
          fi
          cargo bench "${cargo_args[@]}" -- "${criterion_args[@]}" | tee bench-output.txt

      - name: Sanity-check parseable output
        run: |
          set -Eeuo pipefail
          if ! grep -q "ns/iter" bench-output.txt; then
            echo "::error::No 'ns/iter' lines in bench-output.txt."
            echo "Criterion may have failed before producing measurements."
            tail -n 50 bench-output.txt
            exit 1
          fi
          echo "Parsed $(grep -c 'ns/iter' bench-output.txt) benchmark measurements."

      # One file per platform, named by the matrix key, so `perf-report` can
      # download every artifact into a single directory without collisions.
      - name: Render benchmark JSON
        env:
          KEY: ${{ matrix.key }}
          RUNNER_LABEL: ${{ matrix.label }}
          RUNNER_NAME: ${{ matrix.runner }}
          QUALITY: ${{ steps.preflight.outputs.quality }}
        run: |
          set -Eeuo pipefail
          python3 scripts/bench-to-json.py bench-output.txt \
            -o "perf-out/${KEY}.json" \
            --quality "${QUALITY}" \
            --runner "${RUNNER_LABEL}" \
            --note "Measured on ${RUNNER_NAME}. Ratios between libraries are the figures worth reading; absolute times are comparable only within this one platform's column."

      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-json-${{ matrix.key }}
          path: perf-out/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload bencher-format measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-output-${{ matrix.key }}-${{ github.run_id }}
          path: |
            bench-output.txt
            bench-host.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Criterion HTML reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-reports-${{ matrix.key }}-${{ github.run_id }}
          path: target/criterion/
          retention-days: 30
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  #  7.  Perf report — the cross-platform pivot
  # ──────────────────────────────────────────────
  # Without this the matrix leaves four artifacts and no comparison, which is
  # the one thing a multi-arch run exists to produce.
  #
  # Read the table DOWN a column, not across a row: absolute times from four
  # different machines (and two of them shared VMs) are not comparable with each
  # other. What a row does show is a benchmark that behaves structurally
  # differently on one architecture -- an aarch64 column that is 5x its
  # neighbours where every other row is 1.2x is a real signal.
  perf-report:
    name: Perf Report
    needs: [perf-matrix, benchmark]
    # `always()`, so three good platforms still report when a fourth dies; the
    # failed `benchmark` job keeps the run red on its own.
    if: always() && needs.benchmark.result != 'skipped'
    runs-on: ${{ vars.RUNS_ON_ARM64 || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Download every platform's JSON
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: perf-json-*
          merge-multiple: true
          path: perf-out

      - name: Build the cross-platform summary
        env:
          PUBLISHABLE: ${{ needs.perf-matrix.outputs.publish }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          files=(perf-out/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::no benchmark JSON was produced; nothing to report"
            exit 0
          fi
          echo "Merging ${#files[@]} platform result files."

          cat > pivot.jq <<'JQ'
          def us: (. / 1000 * 100 | round / 100 | tostring) + " µs";

          (map(.runner) | unique) as $cols
          | ([ .[] | .runner as $r | .measurements[] | {id, group, r: $r, ns: .ns_per_iter} ]
             | group_by(.id) | sort_by(.[0].group, .[0].id)) as $rows
          | [ "| Benchmark | " + ($cols | join(" | ")) + " |",
              "|:--|" + ($cols | map("--:") | join("|")) + "|" ]
            + [ $rows[]
                | . as $g
                | "| `" + $g[0].id + "` | "
                  + ( $cols
                      | map( . as $c | (($g[] | select(.r == $c) | .ns) // null)
                             | if . == null then "—" else us end )
                      | join(" | ") )
                  + " |" ]
          | .[]
          JQ

          {
            echo "### Cross-platform benchmark results"
            echo
            echo "| Platform | Toolchain | Quality | Measurements |"
            echo "|:--|:--|:--|--:|"
            jq -sr '.[] | "| \(.runner) | \(.toolchain) | \(.quality) | \(.measurements | length) |"' "${files[@]}"
            echo
            jq -sr -f pivot.jq "${files[@]}"
            echo
            echo "> Compare DOWN a column. Absolute times from different hosts are not"
            echo "> comparable, and every \`degraded\` row was measured on a shared VM."
            if [ "${PUBLISHABLE}" != "true" ]; then
              echo ">"
              echo "> Exploratory run on a non-default toolchain: results are shown here"
              echo "> and uploaded as artifacts, but nothing is published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # One artifact carrying every platform, for anyone who wants to diff
          # two runs without downloading four files.
          jq -s --arg run "${GITHUB_RUN_ID}" --arg sha "${GITHUB_SHA}" \
            '{run_id: $run, commit: $sha, platforms: .}' \
            "${files[@]}" > perf-combined.json

      - name: Upload the combined result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-combined-${{ github.run_id }}
          path: perf-combined.json
          retention-days: 90
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  #  The gh-pages baseline gate — deliberately NOT wired up
  # ──────────────────────────────────────────────
  # benchmark-action/github-action-benchmark used to run here as a single-host
  # regression gate. Restoring it under a matrix needs three things: per-platform
  # `benchmark-data-dir-path` (one shared dir interleaves incomparable series),
  # serialised pushes (four jobs racing on gh-pages lose history), and
  # a gate on `needs.perf-matrix.outputs.publish`, so only a default-toolchain
  # run can write, and `contents: write` on whichever job pushes -- absent today because every job
  # here is read-only. docs/benchmarks/results.data.ts also reads ONE
  # benchmarks.json, so publishing four platforms means teaching it the platform
  # dimension first. Until then, read perf-combined.json.
  # benchmark-action/github-action-benchmark used to run here as a single-host
  # regression gate (`alert-threshold: 150%`, `fail-threshold: 200%`), pushing
  # its history to `bench-data/` on gh-pages. Restoring it under a MATRIX needs
  # three changes, none of them cosmetic:
  #
  #   1. Per-platform storage. One `benchmark-data-dir-path` shared by four
  #      hosts interleaves incomparable series into one chart and alerts on the
  #      difference between machines. It has to become `bench-data/<matrix.key>`,
  #      with `name` carrying the platform too.
  #   2. Serialised pushes. Four jobs committing to gh-pages concurrently race;
  #      the loser's history is lost or the push fails outright. Either set
  #      `max-parallel: 1` on the matrix, or move the compare into `perf-report`
  #      and loop over the downloaded artifacts.
  #   3. `permissions: contents: write` on whichever job pushes -- which is why
  #      it is absent today. Every job in this file is read-only, and a write
  #      grant that exists for a disabled step is exactly the silent privilege
  #      this file's header note is about.
  #
  # Also unresolved: docs/benchmarks/results.data.ts reads ONE
  # docs/.data/benchmarks.json, so publishing four platforms means teaching the
  # loader about the platform dimension first. Until then `perf-combined.json`
  # from `perf-report` is the artifact to read.
